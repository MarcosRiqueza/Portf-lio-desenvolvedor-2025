<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Seaquest: Extreme Combat - Definitive</title>
    <style>
        body { margin: 0; background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: 'Arial Black', sans-serif; }
        #container { position: relative; width: 1000px; height: 650px; border: 4px solid #333; box-shadow: 0 0 50px #0055ff; background: #000; }
        canvas { display: block; }
        .hud { position: absolute; top: 15px; width: 100%; display: flex; justify-content: space-around; font-size: 22px; z-index: 5; color: #fff; text-shadow: 2px 2px #000; pointer-events: none; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10; color: #fff; text-align: center; }
        .trophy { font-size: 100px; margin-bottom: 20px; animation: shine 1s infinite alternate; }
        @keyframes shine { from { filter: drop-shadow(0 0 10px gold); } to { filter: drop-shadow(0 0 30px yellow); } }
        #restart-btn { padding: 15px 40px; font-size: 20px; cursor: pointer; background: #ffcc00; border: none; border-radius: 50px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="container">
        <div class="hud">
            <span>MAR: <span id="level">1</span>/10</span>
            <span style="color: #ffcc00;">SCORE: <span id="score">0</span></span>
            <span>ALVOS: <span id="target">0</span>/20</span>
        </div>
        <div id="overlay">
            <div id="content"></div>
            <button id="restart-btn" onclick="location.reload()">REINICIAR</button>
        </div>
        <canvas id="game" width="1000" height="650"></canvas>
    </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const somSonar = new Audio('efeito sonar submarino.mp3');
somSonar.loop = true;

const oceanColors = [
    ['#005c97', '#363795'], ['#1a2a6c', '#b21f1f'], ['#0f0c29', '#302b63'],
    ['#232526', '#414345'], ['#1e3c72', '#2a5298'], ['#000428', '#004e92'],
    ['#4b6cb7', '#182848'], ['#02aab0', '#00cdac'], ['#3a7bd5', '#00d2ff'], ['#000000', '#1a1a1a']
];

let score = 0, level = 1, kills = 0, gameActive = true, frame = 0;
const keys = {};

const sub = {
    x: 450, y: 400, w: 100, h: 40, vx: 0, vy: 0,
    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        
        // Brilho do Farol
        const l = ctx.createRadialGradient(90, 20, 0, 90, 20, 250);
        l.addColorStop(0, 'rgba(0, 242, 254, 0.3)'); l.addColorStop(1, 'transparent');
        ctx.fillStyle = l; ctx.beginPath(); ctx.moveTo(90, 20); ctx.lineTo(350, -80); ctx.lineTo(350, 120); ctx.fill();

        // Casco Metálico 3D
        const g = ctx.createLinearGradient(0,0,0,40);
        g.addColorStop(0, '#ffd700'); g.addColorStop(0.5, '#ccaa00'); g.addColorStop(1, '#665500');
        ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(0, 0, this.w, this.h, 20); ctx.fill();
        
        // Torre e Janelas
        ctx.fillStyle = "#333"; ctx.fillRect(35, -15, 25, 15);
        ctx.fillStyle = "#001a33";
        for(let i=0; i<3; i++) { ctx.beginPath(); ctx.arc(25+(i*22), 20, 6, 0, Math.PI*2); ctx.fill(); }
        
        // Hélice
        ctx.fillStyle = "#222";
        ctx.fillRect(-8, 10 + Math.sin(frame*0.5)*10, 8, 20);
        
        ctx.restore();
    }
};

let boats = [], bombs = [], bullets = [], particles = [];

function createExplosion(x, y, color) {
    for(let i=0; i<20; i++) {
        particles.push({x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 1, color});
    }
}

function spawnBoat() {
    if(boats.length < 2) {
        boats.push({ x: -150, y: 30, w: 130, h: 45, v: 1.5 + (level * 0.4) });
    }
}

function update() {
    if (!gameActive) return;
    frame++;

    if (keys['ArrowLeft']) sub.vx -= 0.6; if (keys['ArrowRight']) sub.vx += 0.6;
    if (keys['ArrowUp']) sub.vy -= 0.6; if (keys['ArrowDown']) sub.vy += 0.6;
    sub.vx *= 0.94; sub.vy *= 0.94;
    sub.x += sub.vx; sub.y += sub.vy;
    sub.x = Math.max(0, Math.min(sub.x, 900)); sub.y = Math.max(120, Math.min(sub.y, 580));

    if (keys[' '] && frame % 12 === 0) bullets.push({ x: sub.x + 50, y: sub.y, v: 9 });

    if (frame % 90 === 0) spawnBoat();

    boats.forEach((b, i) => {
        b.x += b.v;
        if (Math.random() < 0.01 + (level*0.005)) bombs.push({ x: b.x + 60, y: b.y + 40, v: 2 + level });
        
        bullets.forEach((bu, j) => {
            if (bu.x > b.x && bu.x < b.x + b.w && bu.y < b.y + b.h) {
                createExplosion(b.x + 60, b.y + 20, "#ff4b2b");
                boats.splice(i, 1); bullets.splice(j, 1);
                score += 100; kills++; checkLevel();
            }
        });
        if (b.x > 1100) boats.splice(i, 1);
    });

    bullets.forEach((bu, i) => {
        bu.y -= bu.v;
        bombs.forEach((bo, j) => {
            if (Math.hypot(bu.x - bo.x, bu.y - bo.y) < 25) {
                createExplosion(bo.x, bo.y, "orange");
                bullets.splice(i, 1); bombs.splice(j, 1);
                score += 50; kills++; checkLevel();
            }
        });
        if (bu.y < 0) bullets.splice(i, 1);
    });

    bombs.forEach((bo, i) => {
        bo.y += bo.v;
        if (Math.hypot(bo.x - (sub.x + 50), bo.y - (sub.y + 20)) < 35) gameOver();
        if (bo.y > 700) bombs.splice(i, 1);
    });

    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.02;
        if(p.life <= 0) particles.splice(i, 1);
    });

    document.getElementById('score').innerText = score;
    document.getElementById('target').innerText = kills;
}

function checkLevel() {
    if (kills >= 20) {
        if (level >= 10) win();
        else { level++; kills = 0; document.getElementById('level').innerText = level; }
    }
}

function draw() {
    // Fundo Gradiente da Fase
    const g = ctx.createLinearGradient(0, 0, 0, 650);
    g.addColorStop(0, oceanColors[level-1][0]); g.addColorStop(1, oceanColors[level-1][1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, 1000, 650);

    // Superfície
    ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(0, 0, 1000, 85);

    // Navios Detalhados
    boats.forEach(b => {
        ctx.fillStyle = "#333"; ctx.beginPath(); 
        ctx.moveTo(b.x, b.y); ctx.lineTo(b.x+b.w, b.y); 
        ctx.lineTo(b.x+b.w-20, b.y+40); ctx.lineTo(b.x+20, b.y+40); ctx.fill();
        ctx.fillStyle = "#555"; ctx.fillRect(b.x+40, b.y-15, 50, 15);
        ctx.fillStyle = "#777"; ctx.fillRect(b.x+50, b.y-25, 10, 10);
    });

    bullets.forEach(bu => {
        ctx.fillStyle = "#00f2fe"; ctx.fillRect(bu.x, bu.y, 4, 15);
    });

    bombs.forEach(bo => {
        ctx.fillStyle = "#ff4b2b"; ctx.beginPath(); ctx.arc(bo.x, bo.y, 10, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.fillRect(bo.x-1, bo.y-12, 2, 24); ctx.fillRect(bo.x-12, bo.y-1, 24, 2);
    });

    particles.forEach(p => {
        ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.life * 6, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
    });

    sub.draw();
}

function gameOver() {
    gameActive = false;
    document.getElementById('overlay').style.display = 'flex';
    document.getElementById('content').innerHTML = "<h1 style='color:red; font-size:50px'>MISSÃO ABORTADA</h1><p>O submarino foi destruído!</p>";
}

function win() {
    gameActive = false;
    document.getElementById('overlay').style.display = 'flex';
    document.getElementById('content').innerHTML = `
        <div class="trophy">🏆</div>
        <h1 style="color:gold; font-size:45px">CONGRATULATIONS FOR YOUR VICTORY!</h1>
        <p>Você sobreviveu aos 10 oceanos!</p>
    `;
}

window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if(somSonar.paused) somSonar.play().catch(()=>{});
});
window.addEventListener('keyup', e => keys[e.key] = false);

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
