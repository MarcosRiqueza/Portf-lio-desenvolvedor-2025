<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuleiro de Xadrez</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>♟️ Tabuleiro de Xadrez</h1>
            <div class="datetime" id="datetime">Carregando...</div>
        </header>

        <div class="game-container">
            <!-- Painel de Controle -->
            <div class="control-panel">
                <div class="game-mode">
                    <h3>Modo de Jogo</h3>
                    <button id="btn-pvp">👥 2 Jogadores</button>
                    <button id="btn-pve">🤖 Vs Máquina</button>
                    <button id="new-game">🔄 Nova Partida</button>
                </div>

                <div class="game-info">
                    <h3>Informações da Partida</h3>
                    <div class="timer" id="timer">00:00</div>
                    <div class="turn" id="turn">Vez: Brancas</div>
                    <div class="status" id="status">Partida não iniciada</div>
                </div>

                <div class="stats">
                    <h3>Estatísticas</h3>
                    <div class="score" id="score">Brancas 0 - 0 Negras</div>
                    <button id="reset-stats">🔄 Zerar Placar</button>
                </div>

                <div class="difficulty">
                    <h3>Dificuldade (Máquina)</h3>
                    <select id="difficulty">
                        <option value="1">Fácil</option>
                        <option value="2" selected>Médio</option>
                        <option value="3">Difícil</option>
                        <option value="4">Mestre</option>
                    </select>
                </div>
            </div>

            <!-- TABULEIRO DE XADREZ -->
            <div class="chess-board" id="chess-board">
                <!-- JavaScript vai criar as casas aqui -->
            </div>
        </div>

        <div class="game-history">
            <h3>📊 Histórico de Partidas</h3>
            <div class="history-list" id="history-list">
                <!-- Histórico será preenchido pelo JavaScript -->
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
